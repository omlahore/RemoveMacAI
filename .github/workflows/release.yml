name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --arch arm64
      - name: Self-test
        run: "$(swift build -c release --arch arm64 --show-bin-path)/removemacai selftest"
      - name: Package
        run: |
          mkdir -p stage dist
          cp "$(swift build -c release --arch arm64 --show-bin-path)/removemacai" LICENSE THIRD-PARTY-NOTICES.md stage/
          COPYFILE_DISABLE=1 tar -czf dist/removemacai-darwin-arm64.tar.gz -C stage removemacai LICENSE THIRD-PARTY-NOTICES.md
          cd dist && shasum -a 256 removemacai-darwin-arm64.tar.gz > removemacai-darwin-arm64.tar.gz.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/removemacai-darwin-arm64.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --draft

  packslip:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Sign and upload release manifest
        uses: jdx/packslip@2af36e792faa28130987c8af509e475c7458405d # v1.6.0
        with:
          download: removemacai-darwin-arm64.tar.gz
          bin: removemacai
          attest: link
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
